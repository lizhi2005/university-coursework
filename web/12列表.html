<!DOCTYPE html>
<html lang="zh-CN">
<head>
<style>
/* 外层容器：开启弹性多栏横向排列 */
.dl-wrap {
  display: flex;
  gap: 60px; /* 栏目之间间距，和微软页脚一致 */
  background: #f5f5f5;
  padding: 40px 30px;
}
/* 每组dt+dd单独一栏 */
dl {
  margin: 0;
}
/* 栏目标题加粗放大 */
dt {
  font-size: 28px;
  font-weight: bold;
  margin-bottom: 20px;
}
/* 每一行链接/条目，垂直排列 */
dd {
  margin: 0 0 14px 0;
  font-size: 18px;
  color: #333;
}
</style>
</head>
<body>
<div class="dl-wrap">
  <!-- 第一栏 -->
  <dl>
    <dt>服务中心</dt>
    <dd>抖音</dd>
    <dd>小红书</dd>
    <dd>微博</dd>
  </dl>
  <!-- 第二栏 -->
  <dl>
    <dt>戒网所</dt>
    <dd>原神</dd>
    <dd>王者荣耀</dd>
    <dd>瓦洛兰特</dd>
  </dl>
</div>
</body>
</html>
